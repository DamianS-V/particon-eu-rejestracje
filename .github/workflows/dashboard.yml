name: Aktualizuj dashboard PARTICON-EU

on:
  schedule:
    # UTC; four updates per hour. GitHub can delay scheduled jobs.
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
concurrency:
  group: particon-dashboard-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Przygotuj dane i stronę
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Testy
        run: npm test

      - name: Pobierz, zagreguj i zaszyfruj wyniki
        run: npm run sync
        env:
          LIMESURVEY_USERNAME: ${{ secrets.LIMESURVEY_USERNAME }}
          LIMESURVEY_PASSWORD: ${{ secrets.LIMESURVEY_PASSWORD }}
          DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
          LIMESURVEY_ARCHIVED_LABELS: ${{ secrets.LIMESURVEY_ARCHIVED_LABELS }}
          LIMESURVEY_EXCLUDED_RESPONSES: ${{ secrets.LIMESURVEY_EXCLUDED_RESPONSES }}
          ATTENDANCE_SUMMARY: ${{ secrets.ATTENDANCE_SUMMARY }}

      - name: Przygotowanie zaszyfrowanej strony
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

  # Pages can temporarily miss an artifact when deployment immediately follows upload in the same job.
  publish:
    name: Opublikuj dashboard
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publikacja dashboardu
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.prepare.outputs.artifact_name }}
