name: Aktualizuj dashboard PARTICON-EU

on:
  workflow_dispatch:
  schedule:
    # UTC; four updates per hour. GitHub can delay scheduled jobs.
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: particon-dashboard-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Testy
        run: npm test

      - name: Pobierz, zagreguj i zaszyfruj wyniki
        run: npm run sync
        env:
          LIMESURVEY_USERNAME: ${{ secrets.LIMESURVEY_USERNAME }}
          LIMESURVEY_PASSWORD: ${{ secrets.LIMESURVEY_PASSWORD }}
          DASHBOARD_ENCRYPTION_KEY: ${{ secrets.DASHBOARD_ENCRYPTION_KEY }}
          LIMESURVEY_ARCHIVED_LABELS: ${{ secrets.LIMESURVEY_ARCHIVED_LABELS }}
          LIMESURVEY_EXCLUDED_RESPONSES: ${{ secrets.LIMESURVEY_EXCLUDED_RESPONSES }}

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v6

      - name: Przygotowanie zaszyfrowanej strony
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publikacja dashboardu
        id: deployment
        uses: actions/deploy-pages@v5
